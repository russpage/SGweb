  <meta property="og:title"       content="Catering — Snelgrove Ice Cream">
  <meta property="og:description" content="Snelgrove Ice Cream catering — bring the scoop shop to your next event. The Snelgrove Cart, Chiller Cooler, and custom experiences for weddings, parties, and corporate events.">
  <meta property="og:image"       content="https://www.snelgroveicecream.com/images/og-default.jpg">

  <meta property="og:url"         content="https://www.snelgroveicecream.com/catering.html">

  
  <link rel="icon" type="image/png" href="images/favicon-cone.png">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    /* ---- Hero override ---- */
    .catering-hero { background: var(--color-vanilla); }

    /* ---- Intro ---- */
    .catering-intro {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--space-12); align-items: center;
    }
    .catering-intro__img {
      border-radius: var(--radius-xl); width: 100%;
      object-fit: contain;
    }
    .catering-intro__img-placeholder {
      border-radius: var(--radius-xl); aspect-ratio: 3/4;
      background: var(--color-candy-pink); opacity: .4;
      display: flex; align-items: center; justify-content: center;
    }
    .catering-intro__title {
      font-family: var(--font-display);
      font-size: clamp(var(--text-3xl), 4vw, var(--text-5xl));
      font-weight: 900; color: var(--color-blueberry);
      margin-bottom: var(--space-5); line-height: 1.1;
    }
    .catering-intro__body {
      font-size: var(--text-lg); color: var(--color-text-mid);
      line-height: 1.8; margin-bottom: var(--space-6); max-width: 55ch;
    }
    .catering-intro__actions {
      display: flex; flex-wrap: wrap; gap: var(--space-3);
    }

    /* ---- Package Cards ---- */
    .packages-section { background: var(--color-melted); }
    .packages-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: var(--space-8);
      max-width: 1000px; margin-inline: auto;
    }
    .package-card {
      background: var(--color-white); border-radius: var(--radius-xl);
      padding: var(--space-8); box-shadow: var(--shadow-md);
      display: flex; flex-direction: column;
      transition: box-shadow var(--transition-base), transform var(--transition-base);
    }
    .package-card:hover {
      box-shadow: var(--shadow-lg); transform: translateY(-4px);
    }
    .package-card__name {
      font-family: var(--font-display); font-size: var(--text-2xl);
      font-weight: 900; color: var(--color-blueberry);
      margin-bottom: var(--space-3);
    }
    .package-card__desc {
      font-size: var(--text-base); color: var(--color-text-mid);
      line-height: 1.7; margin-bottom: var(--space-5); flex: 1;
    }
    .package-card__pricing {
      background: var(--color-vanilla); border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5); margin-bottom: var(--space-5);
    }
    .package-card__price-label {
      font-size: var(--text-xs); font-weight: 900; letter-spacing: .15em;
      text-transform: uppercase; color: var(--color-cherry);
      margin-bottom: var(--space-2); display: block;
    }
    .package-card__price {
      font-family: var(--font-display); font-size: var(--text-base);
      font-weight: 700; color: var(--color-blueberry); line-height: 1.6;
    }
    .package-card__features { list-style: none; margin-bottom: var(--space-5); }
    .package-card__features li {
      display: flex; align-items: center; gap: var(--space-3);
      font-size: var(--text-sm); color: var(--color-text); margin-bottom: var(--space-3);
    }
    .package-card__features li::before {
      content: '\2713'; display: flex; align-items: center; justify-content: center;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--color-blueberry); color: white; font-size: 11px; font-weight: 900;
      flex-shrink: 0;
    }
    /* ---- Events strip ---- */
    .events-strip { background: var(--color-blueberry); color: var(--color-vanilla); position: relative; overflow: hidden; }
    .events-strip__pattern {
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(45deg, transparent, transparent 30px, rgba(247,210,223,0.04) 30px, rgba(247,210,223,0.04) 31px);
    }
    .events-strip__inner { position: relative; z-index: 1; }
    .events-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: var(--space-6); margin-top: var(--space-10);
    }
    .event-type {
      background: rgba(255,255,255,0.08); border-radius: var(--radius-lg);
      padding: var(--space-6); text-align: center;
      transition: background var(--transition-base);
    }
    .event-type:hover { background: rgba(255,255,255,0.14); }
    .event-type__icon {
      font-size: 32px; margin-bottom: var(--space-3); display: block;
    }
    .event-type__name {
      font-family: var(--font-display); font-size: var(--text-lg);
      font-weight: 700; color: var(--color-vanilla);
    }

    /* ---- Inquiry Form ---- */
    .inquiry-section { background: var(--color-vanilla); }
    .inquiry-grid {
      display: grid; grid-template-columns: 1fr 1.4fr;
      gap: var(--space-12); align-items: start;
    }
    .inquiry-info__title {
      font-family: var(--font-display); font-size: var(--text-3xl);
      font-weight: 900; color: var(--color-blueberry); margin-bottom: var(--space-5);
    }
    .inquiry-info__body {
      font-size: var(--text-base); color: var(--color-text-mid);
      line-height: 1.8; margin-bottom: var(--space-6);
    }
    .inquiry-form-card {
      background: var(--color-white); border-radius: var(--radius-xl);
      padding: var(--space-8); box-shadow: var(--shadow-lg);
    }
    .inquiry-form-card__title {
      font-family: var(--font-display); font-size: var(--text-2xl);
      font-weight: 700; color: var(--color-blueberry); margin-bottom: var(--space-4);
    }
    /* Embedded HoneyBook contact form (placement widget) */
    .hb-embed-wrap {
      position: relative; width: 100%; min-height: 560px;
      border-radius: var(--radius-lg); overflow: hidden;
      background: var(--color-vanilla);
    }
    .hb-embed-wrap iframe { width: 100% !important; border: 0; }
    .inquiry-form-card__note {
      font-size: var(--text-sm); color: var(--color-text-light);
      text-align: center; margin-top: var(--space-4);
    }
    .inquiry-form-card__note a { color: var(--color-cherry); }
    /* Photo column down the left of the inquiry form */
    .inquiry-photo {
      position: relative; border-radius: var(--radius-xl);
      background: linear-gradient(135deg, #F7D2DF44, var(--color-melted), #F4E6AC44);
      overflow: hidden; aspect-ratio: 4/3;
    }
    .inquiry-photo img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .inquiry-photo--feature { aspect-ratio: 4/3; margin-bottom: var(--space-4); }
    .inquiry-photo-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--space-4);
    }
    .inquiry-photo__label {
      position: absolute; left: var(--space-3); bottom: var(--space-3);
      background: rgba(255,255,255,0.92); color: var(--color-blueberry);
      font-family: var(--font-display); font-size: var(--text-xs);
      font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      padding: var(--space-1) var(--space-3); border-radius: var(--radius-full);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
    .form-group { margin-bottom: var(--space-5); }
    .form-label {
      display: block; font-size: var(--text-sm); font-weight: 700;
      color: var(--color-blueberry); margin-bottom: var(--space-2);
    }
    .form-label span { color: var(--color-cherry); }
    .form-input, .form-select, .form-textarea {
      width: 100%; padding: var(--space-3) var(--space-4);
      border: 2px solid var(--color-melted); border-radius: var(--radius-md);
      background: var(--color-vanilla); color: var(--color-blueberry);
      font-family: var(--font-body); font-size: var(--text-base);
      transition: border-color var(--transition-fast);
      outline: none; appearance: none;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--color-cherry); background: var(--color-white);
    }
    .form-textarea { resize: vertical; min-height: 130px; }
    .form-select { cursor: pointer; }
    .form-submit { width: 100%; padding-block: var(--space-4); font-size: var(--text-base); margin-top: var(--space-2); }

    /* ---- Responsive ---- */
    @media (max-width: 900px) {
      .catering-intro { grid-template-columns: 1fr; gap: var(--space-8); }
      .catering-intro__actions { flex-direction: column; align-items: stretch; }
      .catering-intro__actions .btn { justify-content: center; padding-block: var(--space-4); }
      .packages-grid { grid-template-columns: 1fr; }
      .events-grid { grid-template-columns: 1fr; }
      .inquiry-grid { grid-template-columns: 1fr; gap: var(--space-8); }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
