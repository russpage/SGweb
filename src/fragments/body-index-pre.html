<!-- ===================== NAV ===================== -->
  <main id="main-content">

    <h1 class="sr-only">Snelgrove Ice Cream — Handcrafted in Utah since 1929</h1>

    <!-- ===================== HERO ===================== -->
    <!--
      PROMO SYSTEM: To change the hero promotion, update the hero__promo block below.
      Options:
        1. Seasonal message: Update text and link in hero__promo
        2. Product feature: Swap hero image in hero__product-col
        3. Event banner: Add/replace the hero__promo block
      To hide the promo banner, add style="display:none" to .hero__promo
    -->
    <section class="hero hero-slider hero-banner-slider" aria-label="Hero" aria-roledescription="carousel">

      <!-- Slide 1 — Fall Flavors (Coconut Horchata, Pumpkin Pie, Apple Pie a la Mode) -->
      <div class="hero-slider__slide is-active" role="group" aria-roledescription="slide" aria-label="Slide 1 of 2">
        <a href="flavors.html" aria-label="Fall flavors are here — Coconut Horchata, Pumpkin Pie, and Apple Pie a la Mode. See our seasonal flavors.">
          <img src="images/fall-flavors-hero.webp"
               alt="Fall flavors are here — Coconut Horchata, Pumpkin Pie, and Apple Pie a la Mode">
        </a>
      </div>

      <!-- Slide 2 — Make it a Snelgrove Celebration -->
      <div class="hero-slider__slide" role="group" aria-roledescription="slide" aria-label="Slide 2 of 2">
        <img src="images/celebration-hero.webp"
             alt="Make it a Snelgrove Celebration — classic ice cream for birthdays, ballgames, family nights, and office wins">
      </div>

      <button class="hero-slider__arrow hero-slider__arrow--prev" aria-label="Previous slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="hero-slider__arrow hero-slider__arrow--next" aria-label="Next slide">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <button class="hero-slider__pause" aria-label="Pause slideshow" aria-pressed="false">
        <svg class="hero-slider__pause-icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg class="hero-slider__pause-icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M8 5v14l11-7z"/></svg>
      </button>
    </section>
