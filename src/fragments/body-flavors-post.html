  <script>
    (function () {
      const filterBtns    = document.querySelectorAll('.filter-btn');
      const cards         = document.querySelectorAll('.flavor-card-full');
      const seasonalSect  = document.getElementById('seasonal-section');
      const flavorsGrid   = document.getElementById('flavors-grid');
      const filterBar     = document.querySelector('.filter-bar');

      filterBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          filterBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          const filter = btn.dataset.filter;

          // Filter the main grid
          cards.forEach(card => {
            const cats = card.dataset.category || '';
            card.style.display = (filter === 'all' || cats.includes(filter)) ? '' : 'none';
          });

          // Show seasonal section only for "all" or "seasonal" filters
          if (seasonalSect) {
            seasonalSect.style.display = (filter === 'all' || filter === 'seasonal') ? '' : 'none';
          }

          // Smooth-scroll to the relevant section
          const target = (filter === 'seasonal' && seasonalSect) ? seasonalSect : flavorsGrid;
          if (target) {
            const nav       = document.querySelector('.nav');
            const navHeight = nav ? nav.offsetHeight : 80;
            const barHeight = filterBar ? filterBar.offsetHeight : 0;
            const top = target.getBoundingClientRect().top + window.pageYOffset - navHeight - barHeight - 24;
            window.scrollTo({ top, behavior: 'smooth' });
          }
        });
      });
    })();
  </script>
