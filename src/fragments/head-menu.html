<meta name="description" content="Snelgrove Ice Cream scoop shop menu — scoops, sundaes, milkshakes, Utah dirty sodas, treats, and more. Est. 1929.">
  <!-- Open Graph -->
  <meta property="og:title"       content="Menu — Snelgrove Ice Cream">
  <meta property="og:description" content="Snelgrove Ice Cream scoop shop menu — scoops, sundaes, milkshakes, Utah dirty sodas, treats, and more. Est. 1929.">
  <meta property="og:image"       content="https://www.snelgroveicecream.com/images/og-default.jpg">
  <meta property="og:type"        content="website">
  <meta property="og:url"         content="https://www.snelgroveicecream.com/menu.html">

  
  <link rel="icon" type="image/png" href="images/favicon-cone.png">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/nav.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    /* ---- Menu Page ---- */
    .menu-hero {
      background-color: var(--color-blueberry);
      color: var(--color-white);
      text-align: center;
      padding: var(--space-20) var(--space-4) var(--space-16);
      position: relative;
      overflow: hidden;
    }
    .menu-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 20px
      );
    }
    .menu-hero__label {
      display: inline-block;
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-banana-split);
      margin-bottom: var(--space-4);
    }
    .menu-hero__title {
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1.05;
      color: var(--color-white);
      margin-bottom: var(--space-3);
    }
    .menu-hero__script {
      font-family: var(--font-script);
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      color: var(--color-candy-pink);
      display: block;
      margin-bottom: var(--space-5);
    }
    .menu-hero__sub {
      font-size: var(--text-base);
      color: rgba(255,255,255,0.7);
      max-width: 480px;
      margin: 0 auto;
    }

    /* ---- Sticky Category Nav ---- */
    .menu-nav {
      position: sticky;
      top: var(--nav-height);
      z-index: 100;
      background: var(--color-white);
      border-bottom: 2px solid var(--color-border);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .menu-nav::-webkit-scrollbar { display: none; }
    .menu-nav__inner {
      display: flex;
      gap: 0;
      white-space: nowrap;
      max-width: var(--container-wide);
      margin: 0 auto;
      padding: 0 var(--space-6);
    }
    .menu-nav__link {
      display: inline-block;
      padding: var(--space-4) var(--space-5);
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-text-mid);
      text-decoration: none;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
      transition: color var(--transition-fast), border-color var(--transition-fast);
    }
    .menu-nav__link:hover {
      color: var(--color-cherry);
      border-bottom-color: var(--color-cherry);
    }

    /* ---- Menu Body ---- */
    .menu-body {
      background: var(--color-vanilla);
      padding-bottom: var(--space-24);
    }

    /* ---- Section ---- */
    .menu-section {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-16) var(--space-6) 0;
    }

    /* ---- Category Grid ---- */
    .menu-categories {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--space-12) var(--space-6) 0;
    }
    .menu-categories__inner {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-6);
    }
    .menu-category-card {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: var(--color-white);
      border-radius: var(--radius-xl);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-base), box-shadow var(--transition-base);
    }
    .menu-category-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    .menu-category-card__img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: var(--color-white);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3);
    }
    .menu-category-card__img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .menu-category-card__name {
      font-family: var(--font-display);
      font-size: var(--text-xl);
      font-weight: 900;
      color: var(--color-blueberry);
      margin: var(--space-4) var(--space-5) var(--space-2);
    }
    .menu-category-card__desc {
      font-size: var(--text-sm);
      color: var(--color-text-mid);
      line-height: 1.5;
      margin: 0 var(--space-5) var(--space-5);
    }
    @media (max-width: 1024px) {
      .menu-categories__inner { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .menu-categories__inner { grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }
      .menu-categories { padding: var(--space-8) var(--space-4) 0; }
    }
    @media (max-width: 420px) {
      .menu-categories__inner { grid-template-columns: 1fr; }
    }
    .menu-section__header {
      display: flex;
      align-items: baseline;
      gap: var(--space-5);
      margin-bottom: var(--space-8);
      padding-bottom: var(--space-4);
      border-bottom: 2px solid var(--color-border);
    }
    .menu-section__title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 900;
      color: var(--color-blueberry);
      line-height: 1;
    }
    .menu-section__script {
      font-family: var(--font-script);
      font-size: var(--text-xl);
      color: var(--color-cherry);
    }
    .menu-section__note {
      font-size: var(--text-sm);
      color: var(--color-text-light);
      font-style: italic;
      margin-top: var(--space-2);
    }

    /* ---- Item Row ---- */
    .menu-items {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .menu-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item__left {
      flex: 1;
      min-width: 0;
    }
    .menu-item__name {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      color: var(--color-blueberry);
      margin-bottom: var(--space-1);
    }
    .menu-item__desc {
      font-size: var(--text-sm);
      color: var(--color-text-mid);
      line-height: 1.5;
    }
    .menu-item__desc em {
      font-style: normal;
      color: var(--color-text-light);
    }
    .menu-item__price {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-base);
      color: var(--color-cherry);
      white-space: nowrap;
      flex-shrink: 0;
    }
    /* Thumbnail slot — visible placeholder shows until a real photo lands */
    .menu-item__thumb {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-lg);
      background:
        linear-gradient(135deg, rgba(192,57,43,0.06), rgba(247,210,223,0.18)),
        repeating-linear-gradient(
          45deg,
          rgba(192,57,43,0.04) 0,
          rgba(192,57,43,0.04) 6px,
          transparent 6px,
          transparent 12px
        );
      border: 1px dashed rgba(192,57,43,0.18);
      overflow: hidden;
      flex-shrink: 0;
      align-self: flex-start;
      position: relative;
    }
    .menu-item__thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: var(--color-white);
    }
    .menu-item__thumb.is-empty img { display: none; }
    /* Clickable thumbs: subtle hover cue */
    .menu-item__thumb:not(.is-empty),
    .dirty-soda-card__thumb:not(.is-empty) {
      cursor: zoom-in;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .menu-item__thumb:not(.is-empty):hover,
    .dirty-soda-card__thumb:not(.is-empty):hover {
      transform: scale(1.04);
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    /* Lightbox overlay */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(15, 30, 52, 0.88);
      display: flex; align-items: center; justify-content: center;
      padding: var(--space-6);
      z-index: 9999;
      opacity: 0; visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      cursor: zoom-out;
    }
    .lightbox.is-open { opacity: 1; visibility: visible; }
    .lightbox__img {
      max-width: 95vw; max-height: 92vh;
      width: auto; height: auto;
      object-fit: contain;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      background: var(--color-white);
    }
    .lightbox__caption {
      position: absolute;
      bottom: var(--space-6);
      left: 50%;
      transform: translateX(-50%);
      color: var(--color-vanilla);
      font-family: var(--font-display);
      font-size: var(--text-base);
      letter-spacing: 0.05em;
      background: rgba(0,0,0,0.4);
      padding: var(--space-2) var(--space-5);
      border-radius: var(--radius-full);
      pointer-events: none;
    }
    .lightbox__close {
      position: absolute;
      top: var(--space-5); right: var(--space-5);
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.15);
      color: var(--color-vanilla);
      font-size: 24px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition-fast);
    }
    .lightbox__close:hover { background: rgba(255,255,255,0.28); }
    /* Smaller thumbs on phones — still visible, still tappable for the lightbox */
    @media (max-width: 540px) {
      .menu-item__thumb { width: 56px; height: 56px; }
      .menu-item__thumb.is-empty { display: none; }
    }
    /* Dirty soda thumbnail (top of card) */
    .dirty-soda-card__thumb {
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-md);
      background:
        linear-gradient(135deg, rgba(192,57,43,0.06), rgba(247,210,223,0.18)),
        repeating-linear-gradient(
          45deg,
          rgba(192,57,43,0.04) 0,
          rgba(192,57,43,0.04) 6px,
          transparent 6px,
          transparent 12px
        );
      border: 1px dashed rgba(192,57,43,0.18);
      overflow: hidden;
      margin-bottom: var(--space-3);
    }
    .dirty-soda-card__thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: var(--color-white);
    }
    .dirty-soda-card__thumb.is-empty img { display: none; }

    /* ---- Two-col grid for small items (toppings, syrups etc) ---- */
    .menu-items--grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: var(--space-2) var(--space-6);
    }
    .menu-items--grid .menu-item {
      border-bottom: 1px solid var(--color-border);
      padding: var(--space-3) 0;
    }

    /* ---- Add-on pills ---- */
    .menu-addons {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-3);
    }
    .menu-addon-pill {
      background: var(--color-blueberry-light);
      color: var(--color-blueberry);
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
    }
    .menu-addon-pill--cherry {
      background: var(--color-cherry-light);
      color: var(--color-cherry);
    }
    .menu-addon-pill--gold {
      background: var(--color-banana-split);
      color: #6b4f00;
    }

    /* ---- Highlight band ---- */
    .menu-highlight {
      background: var(--color-blueberry);
      color: var(--color-white);
      border-radius: var(--radius-lg);
      padding: var(--space-6) var(--space-8);
      display: flex;
      align-items: center;
      gap: var(--space-6);
      margin-top: var(--space-8);
    }
    .menu-highlight__text {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--color-banana-split);
    }
    .menu-highlight__items {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
    }
    .menu-highlight__item {
      font-size: var(--text-sm);
      color: rgba(255,255,255,0.85);
    }
    .menu-highlight__item::before {
      content: '·';
      margin-right: var(--space-2);
      color: var(--color-banana-split);
    }
    .menu-highlight__item:first-child::before { content: ''; margin: 0; }

    /* ---- Divider ---- */
    .menu-divider {
      max-width: var(--container-max);
      margin: var(--space-16) auto 0;
      padding: 0 var(--space-6);
      border: none;
      border-top: 2px dashed var(--color-border);
    }

    /* ---- Dirty Soda card ---- */
    .dirty-sodas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--space-4);
    }
    .dirty-soda-card {
      background: var(--color-white);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5) var(--space-6);
      box-shadow: var(--shadow-sm);
    }
    .dirty-soda-card__name {
      font-family: var(--font-display);
      font-size: var(--text-base);
      font-weight: 900;
      color: var(--color-blueberry);
      margin-bottom: var(--space-2);
    }
    .dirty-soda-card__recipe {
      font-size: var(--text-sm);
      color: var(--color-text-mid);
      line-height: 1.5;
    }

    /* ---- Cookie flavors ---- */
    .cookie-flavors {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-top: var(--space-4);
    }

    /* ---- No-artificial badge ---- */
    .clean-label-bar {
      background: var(--color-mint-chip);
      border-radius: var(--radius-md);
      padding: var(--space-4) var(--space-6);
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3) var(--space-6);
      margin-top: var(--space-6);
    }
    .clean-label-bar__item {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 700;
      color: #456F39;
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .clean-label-bar__item svg { flex-shrink: 0; }

    @media (max-width: 600px) {
      .menu-section { padding: var(--space-12) var(--space-4) 0; }
      .menu-highlight { flex-direction: column; align-items: flex-start; gap: var(--space-3); }
      .dirty-sodas-grid { grid-template-columns: 1fr; }
    }
  </style>
